name: mongodb-vector-search

services:

  mongodb_lab:
    container_name: 'MongoVectorLab'
    build:
      context: .
      dockerfile: Dockerfile
      target: img-lab
    volumes:
      - ..:/app
      - mongodb-vector-search-bashhistory:/commandhistory
      - mongodb-vector-search-models:/cache/huggingface
    env_file:
      - ../.envs/mongo.env
      - path: ../.envs/anthropic.env
        required: false
    # JupyterLab for notebooks/sandbox.ipynb when not using VS Code (see README)
    ports:
      - 8888:8888
    working_dir: /app
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - sleep infinity

volumes:
  mongodb-vector-search-bashhistory:
  mongodb-vector-search-models:
